# Default classification/assembly config for kitbuilder.
# Copy this file, edit it, and pass --config /path/to/your.yaml to
# `kitbuilder scan` or `kitbuilder report` to override without touching code.

# Splice packs folder used by `kitbuilder run` (or `kitbuilder` with no
# subcommand) and by `scan`/`export` when --source/--out are omitted.
# Change this if your library lives somewhere else.
default_source: "C:\\Users\\ALEXHUTCHINGS\\onedrive\\Documents\\Splice\\samples\\packs"

pads_per_bank: 16

# Every kit lives on exactly one bank. Pads beyond pads_per_bank never
# spill into a second bank — extras are listed as "Alternates" instead.

# Cap on how many files of the same category get a pad (e.g. Kick, Kick 2
# — never Kick 3). Anything beyond this per category goes to Alternates.
max_variations_per_category: 2

# The last N pads of the bank are set aside for the user's own melodic
# samples. Only categories in melodic_categories are allowed to fill them
# (and only if the pack actually has files in those categories) — they are
# never backfilled with extra drum/perc variations, so they stay free.
reserved_melodic_pads: 4

# A kit must have at least one file in every one of these groups to be
# considered complete; each inner list is an "at least one of" — e.g. the
# Hat group is satisfied by either a closed or an open hat. Kits missing
# any group are flagged "incomplete" in the report but still proposed.
required_basics:
  - [Kick]
  - [Snare]
  - [Hat Closed, Hat Open]

# Fill order for the main 12 (pads_per_bank - reserved_melodic_pads) pads.
# Kick/Snare/(one Hat) go first as the guaranteed basics, then everything
# else — including a 2nd Kick/Snare/Hat — fills in this same priority
# order up to max_variations_per_category each.
core_categories:
  - Kick
  - Snare
  - Hat Closed
  - Hat Open
  - Clap
  - Rim/Stick
  - Tom
  - Cymbal
  - Perc

# Only these categories are eligible to fill the reserved melodic pads.
melodic_categories: [Bass, FX, Vocal, Loop]

# If a kit's reserved melodic pads aren't fully used by its own pack's
# Bass/FX/Vocal/Loop files, fill the rest with randomly chosen melodic
# files from anywhere else in the scanned library (still capped at
# max_variations_per_category per category, clearly flagged in the report
# as auto-filled). Set to false to leave those pads empty instead, as
# before.
auto_fill_melodic_from_library: true

# Seed for the auto-fill randomness — same library + same seed always picks
# the same fillers, so re-running `report` doesn't shuffle your kits.md.
# Change it (or just try a different number) to get a different random
# selection.
random_seed: 42

# Try to infer a kit's real name from a shared, non-generic filename token
# (e.g. "BB3_hat_closed_sugar.wav" -> kit name "Sugar"). Falls back to the
# pack folder name whenever no confident label is found. Set to false to
# always use the pack folder name.
infer_kit_name_from_filename: true

# After scanning, the report ranks every complete kit (fullest pad count
# first, then most melodic content, then most category variety, then
# fewest files needing format conversion) and pre-checks ([x]) this many
# of the best ones so `export` can be run immediately without hand-ticking
# boxes. The rest stay unchecked ([ ]) for you to review. Set to 0 to
# leave everything unchecked, as before.
auto_approve_top_n: 10

# Ordered category -> keyword list. Order matters twice over:
# - it's the priority order used to break "matches >1 category" ties
# - it's the pad-fill priority within core_categories/melodic_categories
# Keyword matching is case-insensitive and matches anywhere in the filename.
categories:
  Kick: [kick, kck, bd, bassdrum]
  Snare: [snare, snr, sd]
  Clap: [clap, clp]
  Hat Closed: [hat, hh, chh, closedhat]
  Hat Open: [openhat, ohh]
  Rim/Stick: [rim, stick, clave]
  Tom: [tom]
  Cymbal: [cymbal, crash, ride]
  Perc: [perc, shaker, tamb, conga, bongo]
  Bass: [bass, sub]
  FX: [fx, riser, impact, sweep, noise]
  Vocal: [vox, vocal, chant]
  Loop: [loop, break]

exclude_folders: [midi, "project files", documentation]
extensions: [.wav, .aiff, .aif]
