name: Build standalone Windows exe

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-exe.yml"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + PyInstaller
        run: |
          pip install -e ".[build]"

      - name: Build kitbuilder.exe
        run: |
          pyinstaller --onefile --name kitbuilder `
            --add-data "src/kitbuilder/categories.yaml;kitbuilder" `
            scripts/pyinstaller_entry.py

      - name: Smoke test the exe
        run: |
          .\dist\kitbuilder.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: kitbuilder-windows-exe
          path: dist/kitbuilder.exe
          retention-days: 14

      # Publishes to a GitHub Release so the exe is a plain browser download —
      # this step runs entirely on GitHub's infrastructure using the
      # workflow's own token, no separate upload step needed.
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-exe
          name: kitbuilder.exe (Windows, standalone)
          body: >
            Auto-built by .github/workflows/build-exe.yml from commit
            ${{ github.sha }}. No install needed — download kitbuilder.exe
            and run it directly.
          files: dist/kitbuilder.exe
          prerelease: true
